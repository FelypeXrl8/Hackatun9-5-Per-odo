<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Bolão</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-container">
    <div class="admin-card">
        <h1 class="admin-title">Admin Bolão</h1>
        <p class="admin-subtitle">Entre para gerenciar seleções, partidas, resultados, ranking e usuários.</p>

        <div th:if="${param.error}" class="admin-message admin-error">E-mail ou senha inválidos, ou usuário bloqueado.</div>
        <div th:if="${param.logout}" class="admin-message">Sessão encerrada com sucesso.</div>

        <form class="admin-form" method="post" th:action="@{/admin/login}">
            <div>
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" value="admin@bolao.com" required>
            </div>

            <div>
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" value="admin123" required>
            </div>

            <button class="admin-button" type="submit">Entrar no painel</button>
        </form>
    </div>
</div>
</body>
</html>
