<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleções | Bolão Copa 2026</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="wrapper">
    <aside class="sidebar">
        <div class="brand">Bolão 2026</div>
        <div class="brand-subtitle">Painel administrativo</div>
        <a class="nav-link" th:href="@{/admin}">Dashboard</a>
        <a class="nav-link active" th:href="@{/admin/selecoes}">Seleções</a>
        <a class="nav-link" th:href="@{/admin/partidas}">Partidas</a>
        <a class="nav-link" th:href="@{/admin/usuarios}">Usuários</a>
        <form class="logout-form" th:action="@{/admin/logout}" method="post">
            <button class="logout-button" type="submit">Sair</button>
        </form>
    </aside>

    <main class="main">
        <section class="header">
            <div>
                <h1>Seleções</h1>
                <p>Cadastre, edite e remova seleções classificadas.</p>
            </div>
        </section>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <section class="card">
            <h2 class="card-title">Nova seleção</h2>
            <form th:action="@{/admin/selecoes}" method="post" class="form-grid" onsubmit="return confirm('Confirmar cadastro desta seleção?')">
                <div class="form-group">
                    <label for="nome">Nome da seleção</label>
                    <input id="nome" name="nome" placeholder="Brasil" required>
                </div>
                <div class="form-group">
                    <label for="codigoFifa">Código FIFA</label>
                    <input id="codigoFifa" name="codigoFifa" placeholder="BRA" maxlength="3" minlength="3" required>
                </div>
                <div class="form-group">
                    <label for="grupo">Grupo</label>
                    <input id="grupo" name="grupo" placeholder="A" maxlength="2">
                </div>
                <div class="form-group">
                    <label for="urlImagem">URL da imagem</label>
                    <input id="urlImagem" name="urlImagem" placeholder="https://flagcdn.com/w320/br.png">
                </div>
                <div class="form-group full">
                    <button class="btn btn-primary" type="submit">Cadastrar seleção</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2 class="card-title">Seleções cadastradas</h2>
            <div th:if="${#lists.isEmpty(selecoes)}" class="empty">Nenhuma seleção cadastrada ainda.</div>

            <div th:if="${!#lists.isEmpty(selecoes)}" class="card-list">
                <article class="item-card" th:each="selecao : ${selecoes}">
                    <div class="item-header">
                        <div class="item-title-area">
                            <img class="flag" th:if="${selecao.urlImagem != null and selecao.urlImagem != ''}" th:src="${selecao.urlImagem}" alt="Bandeira">
                            <div>
                                <h3 th:text="${selecao.nome}">Brasil</h3>
                                <p>
                                    <span class="badge" th:text="${selecao.codigoFifa}">BRA</span>
                                    <span th:if="${selecao.grupo != null and selecao.grupo != ''}" th:text="|Grupo ${selecao.grupo}|">Grupo A</span>
                                    <span th:if="${selecao.grupo == null or selecao.grupo == ''}">Sem grupo</span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <form th:action="@{/admin/selecoes/{id}(id=${selecao.id})}" method="post" class="compact-grid">
                        <div class="form-group">
                            <label>Nome</label>
                            <input name="nome" th:value="${selecao.nome}" required>
                        </div>
                        <div class="form-group">
                            <label>Código FIFA</label>
                            <input name="codigoFifa" th:value="${selecao.codigoFifa}" maxlength="3" minlength="3" required>
                        </div>
                        <div class="form-group">
                            <label>Grupo</label>
                            <input name="grupo" th:value="${selecao.grupo}" maxlength="2">
                        </div>
                        <div class="form-group">
                            <label>URL da imagem</label>
                            <input name="urlImagem" th:value="${selecao.urlImagem}">
                        </div>
                        <div class="form-group">
                            <button class="btn btn-primary" type="submit">Salvar edição</button>
                        </div>
                    </form>

                    <form th:action="@{/admin/selecoes/{id}/remover(id=${selecao.id})}" method="post" onsubmit="return confirm('Remover esta seleção? Se ela estiver em partidas, o sistema vai impedir para não quebrar o banco.')">
                        <button class="btn btn-danger" type="submit">Remover seleção</button>
                    </form>
                </article>
            </div>
        </section>
    </main>
</div>
</body>
</html>
